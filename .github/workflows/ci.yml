name: CI

on:
  workflow_dispatch:
    inputs:
      logLevel:
        description: 'Log level'
        required: true
        default: 'info'
        type: choice
        options:
        - info
        - warning
        - debug
      git-ref:
        description: Git Ref (Optional)
        required: false
  push:
    branches:
      - master
      - main
      - '**-rc'
      - production
      - 'production-hotfix'
      - 'v*'
  pull_request:
    branches:
      - master
      - main

permissions:
  id-token: write        # This is required for requesting the JWT
  contents: read         # This is required for actions/checkout
  pull-requests: write   # Required by sonar workflow for PR decoration

jobs:
  # lint-test:
  #   if: ${{ github.event_name == 'pull_request' }}
  #   name: Quality Assurance
  #   uses: kobiton/deployment/.github/workflows/ci-lint-test.yaml@KOB-52442
  #   with:
  #     node-version: '22.13.1'
  #     sync-submodule: 'true'
  #   secrets: inherit

  build-push-image:
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
    name: Build and Push image to ECR
    uses: kobiton/deployment/.github/workflows/ci.yaml@master
    with:
      git-ref: ${{ github.event.inputs.git-ref }}
      repo-name: 'appium-script-generator'
    secrets: inherit

  # --- Feature-per-Release: Build, push, and deploy on PR ---

  detect-target-env:
    if: ${{ github.event_name == 'pull_request' }}
    uses: kobiton/deployment/.github/workflows/detect-target-env.yaml@KOB-52442
    secrets: inherit

  # sonar:
  #   if: ${{ github.event_name == 'pull_request' }}
  #   name: SonarCloud
  #   uses: kobiton/deployment/.github/workflows/sonar.yaml@KOB-52442
  #   with:
  #     node-version: '20.10.0'
  #   secrets: inherit

  build-push-image-pr:
    # needs: [lint-test, sonar, detect-target-env]
    needs: [detect-target-env]
    if: ${{ github.event_name == 'pull_request' }}
    name: Build and Push image to ECR (PR)
    uses: kobiton/deployment/.github/workflows/ci.yaml@KOB-52442
    with:
      repo-name: appium-script-generator
      sync-submodule: 'true'
      sandbox-env: ${{ needs.detect-target-env.outputs.environment }}
      branch-name: ${{ github.head_ref }}
    secrets: inherit
